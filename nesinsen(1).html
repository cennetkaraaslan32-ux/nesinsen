<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NesinSen?</title>
<style>
*{box-sizing:border-box}
body{
    margin:0; min-height:100vh; padding:24px;
    font-family:Arial,sans-serif;
    background:linear-gradient(135deg,#650019,#c2185b,#ff4f81);
    display:flex; align-items:center; justify-content:center; color:#fff;
}
.card{
    width:100%; max-width:650px; padding:34px;
    background:rgba(55,0,15,.92); border-radius:26px;
    box-shadow:0 20px 60px rgba(0,0,0,.4);
}
h1{text-align:center;font-size:44px;margin:0 0 8px}
.subtitle{text-align:center;color:#ffd7e2;margin-bottom:30px}
label{display:block;font-weight:bold;margin:20px 0 8px}
input,select{
    width:100%; padding:14px; border:0; border-radius:12px;
    font-size:16px; background:white; color:#333;
}
.options{display:flex;flex-direction:column;gap:12px}
.option{
    width:100%; padding:16px; border-radius:15px;
    border:2px solid #a52a52; background:#7e1538;
    color:white; text-align:left; cursor:pointer;
    transition:.2s;
}
.option:hover{background:#a91d4e;border-color:#ff9fba}
.option.selected{
    background:#e91e63;
    border-color:#ffd1de;
    box-shadow:0 0 0 3px rgba(255,105,150,.25);
}
.number{font-size:20px;font-weight:bold;margin-right:8px}
.title{font-weight:bold}
.desc{display:block;margin-top:5px;color:#ffe0e8;font-size:14px;line-height:1.4}
.analyze{
    width:100%; margin-top:25px; padding:15px;
    border:0; border-radius:13px;
    background:linear-gradient(90deg,#ff1744,#ff4081);
    color:white; font-size:17px; font-weight:bold; cursor:pointer;
}
.analyze:hover{transform:translateY(-2px)}
#sonuc{
    display:none; margin-top:22px; padding:20px;
    border-radius:16px; background:white; color:#9b1645;
    text-align:center; font-size:20px; font-weight:bold;
}
.warning{text-align:center;color:#ffc8d7;font-size:12px;margin-top:18px}
</style>
</head>
<body>
<div class="card">
    <h1>💗 NesinSen?</h1>
    <div class="subtitle">İletişimde olduğun kişiyi biraz analiz edelim...</div>

    <label for="isim">İsminiz</label>
    <input id="isim" type="text" placeholder="İsminizi giriniz">

    <label for="neyi">Bu kişi neyiniz oluyor?</label>
    <select id="neyi">
        <option value="">Seçiniz</option>
        <option>Sevgili</option>
        <option>Flört</option>
        <option>Arkadaş</option>
    </select>

    <label>Size nasıl davranıyor?</label>

    <div class="options">
        <button type="button" class="option" data-value="1">
            <span class="number">1.</span>
            <span class="title">Bir anda ortadan kayboluyorsa</span>
            <span class="desc">3 saatten uzun süre mesaja bakmıyor veya aniden iletişimi kesiyorsa.</span>
        </button>

        <button type="button" class="option" data-value="2">
            <span class="number">2.</span>
            <span class="title">Bazen çok sevgi dolu, bazen buz gibiyse</span>
            <span class="desc">Bir anda aşırı ilgili olup sonra tamamen soğuk davranıyorsa.</span>
        </button>

        <button type="button" class="option" data-value="3">
            <span class="number">3.</span>
            <span class="title">Diğer</span>
            <span class="desc">Yukarıdaki seçeneklerden hiçbiri sana uymuyorsa.</span>
        </button>
    </div>

    <button class="analyze" id="analiz">💘 ANALİZ ET</button>

    <div id="sonuc"></div>

    <div class="warning">
        Bu uygulama sadece eğlence amaçlıdır. Gerçek bir ilişki veya psikolojik değerlendirme değildir.
    </div>
</div>

<script>
let davranis = "";

document.querySelectorAll(".option").forEach(option => {
    option.addEventListener("click", function() {
        document.querySelectorAll(".option").forEach(o => o.classList.remove("selected"));
        this.classList.add("selected");
        davranis = this.dataset.value;
    });
});

document.getElementById("analiz").addEventListener("click", function() {
    const isim = document.getElementById("isim").value.trim();
    const sonuc = document.getElementById("sonuc");

    if (!isim) {
        sonuc.textContent = "Önce isminizi girin 💗";
        sonuc.style.display = "block";
        return;
    }

    if (!davranis) {
        sonuc.textContent = "Önce size nasıl davrandığını seçin 💗";
        sonuc.style.display = "block";
        return;
    }

    if (davranis === "1") {
        sonuc.textContent = `${isim}, ghostlanıyor olabilirsiniz :( 👻`;
    } else if (davranis === "2") {
        sonuc.textContent = `${isim}, lovebombingleniyor olabilirsiniz 💣💗`;
    } else {
        sonuc.textContent = `${isim}, buradaysanız zaten çoktan ceptesinizdir :( 💔`;
    }

    sonuc.style.display = "block";
});
</script>
</body>
</html>
